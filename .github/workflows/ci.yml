name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.33"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --extra dev --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync pytest
      - run: uv build
      - name: Verify packaged workspace assets
        run: >-
          uv run --no-sync python -c
          "import glob, zipfile;
          wheel = zipfile.ZipFile(glob.glob('dist/*.whl')[0]);
          assert 'zanshin_proof/workspace.html' in wheel.namelist()"
      - name: Generate synthetic review workspace
        run: uv run --no-sync python examples/workspace/make_demo.py
      - name: Evaluate example evidence
        run: >-
          uv run --no-sync zanshin-proof evaluate
          --policy examples/recommendation/policy.yml
          --evidence examples/recommendation/evidence.json
          --output proof-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: proof-report
          path: |
            proof-report.json
            proof-workspace.html

